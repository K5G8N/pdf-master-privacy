name: Deploy PDF Master Privacy Policy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Clear the stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployments } = await github.request(
              'GET /repos/{owner}/{repo}/deployments',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'github-pages',
                per_page: 100
              }
            );

            let cleared = 0;
            for (const deployment of deployments) {
              if (deployment.sha === context.sha) continue;

              const { data: statuses } = await github.request(
                'GET /repos/{owner}/{repo}/deployments/{deployment_id}/statuses',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 1
                }
              );
              const state = statuses[0]?.state;
              if (state !== 'queued' && state !== 'in_progress') continue;

              try {
                await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pages_deployment_id: deployment.sha
                  }
                );
              } catch (error) {
                if (error.status !== 404 && error.status !== 409) throw error;
              }

              await github.request(
                'POST /repos/{owner}/{repo}/deployments/{deployment_id}/statuses',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Canceled stale Pages deployment before publishing.'
                }
              );
              cleared += 1;
            }

            core.info('Cleared ' + cleared + ' stale Pages deployment(s).');
            await new Promise(resolve => setTimeout(resolve, 3000));
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
