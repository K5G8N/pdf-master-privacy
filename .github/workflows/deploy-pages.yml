name: Deploy PDF Master Privacy Policy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Clear the stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const staleCommit = 'c25b2995fb337ff73028c68a958e7ce327f00049';
            try {
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: staleCommit
                }
              );
              core.info('Canceled the stale Pages deployment.');
            } catch (error) {
              if (error.status !== 404 && error.status !== 409) throw error;
              core.info('The stale Pages deployment is already inactive.');
            }

            const { data: deployments } = await github.request(
              'GET /repos/{owner}/{repo}/deployments',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: staleCommit,
                environment: 'github-pages',
                per_page: 100
              }
            );

            for (const deployment of deployments.filter(item => item.sha === staleCommit)) {
              const { data: statuses } = await github.request(
                'GET /repos/{owner}/{repo}/deployments/{deployment_id}/statuses',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 1
                }
              );
              if (statuses[0]?.state !== 'inactive') {
                await github.request(
                  'POST /repos/{owner}/{repo}/deployments/{deployment_id}/statuses',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: deployment.id,
                    state: 'inactive',
                    description: 'Cleared stale Pages deployment before publishing.'
                  }
                );
                core.info('Marked the stale GitHub deployment inactive.');
              }
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
