name: Deploy PDF Master Privacy Policy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Cancel abandoned Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: 'c25b2995fb337ff73028c68a958e7ce327f00049'
                }
              );
              core.info('Canceled the abandoned Pages deployment.');
            } catch (error) {
              if (error.status === 404 || error.status === 409) {
                core.info('The abandoned Pages deployment is already inactive.');
              } else {
                throw error;
              }
            }
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
